<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123b2c">
    <title>Offline - RKB Dapur</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f6f5; color: #21352b; font: 16px/1.6 system-ui, sans-serif; }
        main { max-width: 440px; text-align: center; padding: 36px 28px; border-radius: 20px; background: #fff; box-shadow: 0 16px 48px #123b2c1c; }
        img { width: 76px; height: 76px; margin-bottom: 14px; }
        h1 { margin: 0 0 8px; font-size: 1.5rem; }
        p { margin: 0 0 20px; color: #617168; }
        a { display: inline-block; border-radius: 10px; padding: 10px 18px; background: #1a5c45; color: white; font-weight: 650; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <img src="./logo.png" alt="">
        <h1>Anda sedang offline</h1>
        <p>Halaman RKB Dapur memerlukan koneksi internet. Sambungkan kembali lalu coba buka halaman ini.</p>
        <a href="./login">Coba lagi</a>
    </main>
</body>
</html>
